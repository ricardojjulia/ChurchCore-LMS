name: Release

on:
  push:
    branches: [main]

jobs:
  ci:
    name: Run CI Suite
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging deployment configuration
        shell: bash
        run: |
          missing=0
          for name in STAGING_SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing %s. Configure it in the staging GitHub environment.\n' "$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Push migrations to staging
        run: |
          supabase db push \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF" --yes

      - name: Deploy Edge Functions to staging
        run: |
          supabase functions deploy search-users weekly-digest \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate production deployment configuration
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing %s. Configure it in the production GitHub environment.\n' "$name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Push migrations to production
        run: |
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy search-users weekly-digest \
            --project-ref "$SUPABASE_PROJECT_REF"

      # Vercel picks up the push to main automatically via its GitHub integration.
      # This step exists only to confirm the deploy succeeded and notify.
      - name: Wait for Vercel deploy
        run: |
          echo "Vercel production deploy triggered by push to main."
          echo "Monitor at: https://vercel.com/dashboard"

      - name: Notify on success
        if: success()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -s -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"✅ ChurchCore LMS deployed to production — commit ${{ github.sha }} by ${{ github.actor }}\"}"
          else
            echo "DEPLOY_WEBHOOK_URL not set — skipping notification"
          fi

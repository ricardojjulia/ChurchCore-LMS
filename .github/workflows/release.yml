name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  ci:
    name: Run CI Suite
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci
    environment: staging
    env:
      STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      EXPECTED_STAGING_SUPABASE_PROJECT_REF: gytbfezrfrpsltdyfdgj
      PRODUCTION_SUPABASE_PROJECT_REF: tpyvciujsrllvowqgeyq
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          missing=0
          for name in STAGING_SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing %s. Configure it in the staging GitHub environment.\n' "$name"
              missing=1
            fi
          done
          if [[ -n "$STAGING_SUPABASE_PROJECT_REF" && "$STAGING_SUPABASE_PROJECT_REF" != "$EXPECTED_STAGING_SUPABASE_PROJECT_REF" ]]; then
            printf '::error::STAGING_SUPABASE_PROJECT_REF does not match the reviewed staging target.\n'
            missing=1
          fi
          if [[ "$STAGING_SUPABASE_PROJECT_REF" == "$PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            printf '::error::The staging project reference matches production.\n'
            missing=1
          fi
          exit "$missing"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Push migrations to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF" --yes

      - name: Deploy Edge Functions to staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy search-users weekly-digest \
            --project-ref "$STAGING_SUPABASE_PROJECT_REF"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    permissions:
      contents: read
      deployments: read
      statuses: read
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EXPECTED_PRODUCTION_SUPABASE_PROJECT_REF: tpyvciujsrllvowqgeyq
    steps:
      - uses: actions/checkout@v4

      - name: Verify this is the latest main release
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            printf '::error::A newer main commit exists; refusing to deploy this stale release.\n'
            exit 1
          fi

      - name: Validate production deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN VERCEL_DEPLOY_HOOK_URL; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing %s. Configure it in the production GitHub environment.\n' "$name"
              missing=1
            fi
          done
          if [[ -n "$SUPABASE_PROJECT_REF" && "$SUPABASE_PROJECT_REF" != "$EXPECTED_PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            printf '::error::SUPABASE_PROJECT_REF does not match the reviewed production target.\n'
            missing=1
          fi
          exit "$missing"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" --yes

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy search-users weekly-digest \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Trigger Vercel production deployment
        id: vercel-trigger
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          git fetch --no-tags origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            printf '::error::A newer main commit exists; refusing to trigger Vercel for this stale release.\n'
            exit 1
          fi
          echo "triggered_at=$(date -u +%s)" >> "$GITHUB_OUTPUT"
          response="$(curl --fail --silent --show-error --request POST "$VERCEL_DEPLOY_HOOK_URL")"
          job_id="$(jq -r '.job.id // empty' <<< "$response")"
          if [[ -z "$job_id" ]]; then
            printf '::error::Vercel did not return a deployment job id.\n'
            exit 1
          fi
          echo "Vercel deployment job accepted."

      - name: Verify Vercel production deployment
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGERED_AT: ${{ steps.vercel-trigger.outputs.triggered_at }}
        run: |
          deadline=$((SECONDS + 900))
          while (( SECONDS < deadline )); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/status" --jq '[.statuses[] | select(.context == "Vercel") | select((.updated_at | fromdateiso8601) >= (env.TRIGGERED_AT | tonumber))][0] // empty')"
            if [[ -n "$status" ]]; then
              state="$(jq -r '.state' <<< "$status")"
              target_url="$(jq -r '.target_url // empty' <<< "$status")"
              if [[ "$target_url" != https://vercel.com/* ]]; then
                printf '::error::Vercel status did not provide a Vercel deployment URL.\n'
                exit 1
              fi
              case "$state" in
                success)
                  echo "Vercel production deployment succeeded: $target_url" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                error|failure)
                  printf '::error::Vercel production deployment ended with state %s.\n' "$state"
                  exit 1
                  ;;
              esac
            fi

            sleep 10
          done

          printf '::error::Timed out waiting for Vercel production deployment.\n'
          exit 1

      - name: Notify on success
        if: success()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -s -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"✅ ChurchCore LMS deployed to production — commit ${{ github.sha }} by ${{ github.actor }}\"}"
          else
            echo "DEPLOY_WEBHOOK_URL not set — skipping notification"
          fi

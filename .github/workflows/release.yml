name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: true

jobs:
  ci:
    name: Run CI Suite
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # No staging environment exists (ADR-2026-011). The production
  # environment's required-reviewer approval is the pre-deploy gate, and CI
  # (including E2E against a disposable local Supabase stack) runs first.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    permissions:
      contents: read
    env:
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      EXPECTED_PRODUCTION_SUPABASE_PROJECT_REF: tpyvciujsrllvowqgeyq
    steps:
      - uses: actions/checkout@v5

      - name: Verify this is the latest main release
        shell: bash
        run: |
          git fetch --no-tags origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            printf '::error::A newer main commit exists; refusing to deploy this stale release.\n'
            exit 1
          fi

      - name: Validate production deployment configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          missing=0
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN VERCEL_TOKEN; do
            if [[ -z "${!name}" ]]; then
              printf '::error::Missing %s. Configure it in the production GitHub environment.\n' "$name"
              missing=1
            fi
          done
          if [[ -n "$SUPABASE_PROJECT_REF" && "$SUPABASE_PROJECT_REF" != "$EXPECTED_PRODUCTION_SUPABASE_PROJECT_REF" ]]; then
            printf '::error::SUPABASE_PROJECT_REF does not match the reviewed production target.\n'
            missing=1
          fi
          exit "$missing"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.116.0

      # Keep the production connection on the pooler too; GitHub-hosted
      # runners do not support the IPv6-only direct database endpoint.
      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push migrations to production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --include-all is required: 20260918100000_platform_feedback.sql is
          # intentionally timestamped earlier than a migration already applied
          # here. It's idempotent (CREATE TABLE IF NOT EXISTS etc.) and the CLI
          # never re-applies an already-tracked migration, so this is safe —
          # do not remove without checking `supabase migration list` first.
          supabase db push \
            --linked --include-all --yes

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Deploy every function in supabase/functions (per-function
          # verify_jwt comes from supabase/config.toml). Listing names by hand
          # meant fixes to any other function never reached production.
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      # Deploy this exact commit with the Vercel CLI. The deploy hook used
      # before built whatever main was when it fired, so a release could ship a
      # different commit than the one that passed CI and was approved (Copilot
      # review #6). The checked-out files are uploaded and built by Vercel
      # itself: a CI-side `vercel build` cannot see variables marked Sensitive
      # (`vercel pull` returns a placeholder), which broke the first attempt.
      # The project ids are not secrets.
      - name: Deploy this commit to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_NeSmoYaK8Ipt4aIP6PAW42Mi
          VERCEL_PROJECT_ID: prj_SmWFVrpIrj8BXpmOKyRtqEInXnOd
        run: |
          git fetch --no-tags origin main
          if [[ "$GITHUB_SHA" != "$(git rev-parse origin/main)" ]]; then
            printf '::error::A newer main commit exists; refusing to deploy this stale release.\n'
            exit 1
          fi
          url="$(npx --yes vercel@59.26.0 deploy --prod --yes --token "$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA")"
          echo "Vercel production deployment of $GITHUB_SHA: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on success
        if: success()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -s -X POST "$DEPLOY_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"✅ ChurchCore LMS deployed to production — commit ${{ github.sha }} by ${{ github.actor }}\"}"
          else
            echo "DEPLOY_WEBHOOK_URL not set — skipping notification"
          fi

  # COUNCIL-2026-031 D8 — post-release checks against production as the
  # synthetic-QA tenant (scripts/prod-synthetic-bootstrap.mjs). Uses
  # repository-level secret/variables (not the production environment) so it
  # does not ask for a second approval. Skips until the one-time setup is done.
  synthetic:
    name: Production synthetic checks
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_BASE_URL }}
      SYNTHETIC_SUPABASE_URL: ${{ vars.SYNTHETIC_SUPABASE_URL }}
      SYNTHETIC_SUPABASE_ANON_KEY: ${{ vars.SYNTHETIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Check configuration
        id: config
        env:
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
        run: |
          if [[ -z "$SYNTHETIC_BASE_URL" || -z "$SYNTHETIC_PASSWORD" ]]; then
            echo "::notice::Synthetic checks skipped: set repository variable SYNTHETIC_BASE_URL and secret SYNTHETIC_PASSWORD (see docs/testing.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'

      - name: Setup Node
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and Chromium
        if: steps.config.outputs.enabled == 'true'
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run synthetic checks against production
        if: steps.config.outputs.enabled == 'true'
        env:
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
          CI: 'true'
        run: npx playwright test -c tests/playwright/playwright.config.ts --project=prod-synthetic

      - name: Upload report
        if: failure() && steps.config.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            curl -s -X POST "$DEPLOY_WEBHOOK_URL" -H "Content-Type: application/json" \
              -d "{\"text\": \"⚠️ ChurchCore LMS production synthetic checks FAILED after deploy of ${{ github.sha }} — see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi

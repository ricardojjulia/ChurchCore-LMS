<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ChurchCore LMS Heraldic Shield Dark Mark">
  <defs>
    <linearGradient id="goldGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D6" />
      <stop offset="35%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#B38622" />
    </linearGradient>
    <linearGradient id="shieldFillDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A68" />
      <stop offset="100%" stop-color="#0E1E36" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M128 16 L208 44 C208 144 168 204 128 240 C88 204 48 144 48 44 Z" 
        fill="url(#shieldFillDark)" 
        stroke="url(#goldGradDark)" 
        stroke-width="7" 
        stroke-linejoin="round" />

  <!-- Inner Shield Inset Border -->
  <path d="M128 30 L194 54 C194 136 160 188 128 220 C96 188 62 136 62 54 Z" 
        fill="none" 
        stroke="url(#goldGradDark)" 
        stroke-width="2" 
        stroke-opacity="0.7" />

  <!-- The Ascending Cross Apex -->
  <path d="M128 42 V94 M114 58 H142" 
        stroke="url(#goldGradDark)" 
        stroke-width="6" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Discipleship Formation Halo Arc -->
  <path d="M88 108 A48 48 0 0 1 168 108" 
        fill="none" 
        stroke="url(#goldGradDark)" 
        stroke-width="4" 
        stroke-linecap="round" />

  <!-- The Ascending Steps of Learning / Formation -->
  <path d="M112 142 H144 M106 128 H150 M100 114 H156 M94 100 H162" 
        stroke="url(#goldGradDark)" 
        stroke-width="4.5" 
        stroke-linecap="round" />

  <!-- The Open Word / Scripture Foundation -->
  <path d="M68 176 C94 166 116 172 128 184 C140 172 162 166 188 176 L188 196 C162 186 140 192 128 204 C116 192 94 186 68 196 Z" 
        fill="#0E1E36" 
        stroke="url(#goldGradDark)" 
        stroke-width="4.5" 
        stroke-linejoin="round" />

  <!-- Center Spine of Open Book -->
  <line x1="128" y1="184" x2="128" y2="204" stroke="url(#goldGradDark)" stroke-width="4" stroke-linecap="round" />
</svg>

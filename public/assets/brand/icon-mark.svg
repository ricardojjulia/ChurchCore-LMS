<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ChurchCore LMS Heraldic Shield Mark">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E7C4" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9A7B1C" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3B6F" />
      <stop offset="100%" stop-color="#0B1A30" />
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#132B50" />
      <stop offset="100%" stop-color="#091426" />
    </linearGradient>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M128 16 L208 44 C208 144 168 204 128 240 C88 204 48 144 48 44 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linejoin="round" />

  <!-- Inner Shield Inset Border -->
  <path d="M128 30 L194 54 C194 136 160 188 128 220 C96 188 62 136 62 54 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="2" 
        stroke-opacity="0.6" />

  <!-- The Ascending Cross Apex -->
  <path d="M128 42 V94 M114 58 H142" 
        stroke="url(#goldGrad)" 
        stroke-width="6" 
        stroke-linecap="round" />

  <!-- Discipleship Formation Halo Arc -->
  <path d="M88 108 A48 48 0 0 1 168 108" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="4" 
        stroke-linecap="round" />

  <!-- The Ascending Steps of Learning / Formation -->
  <path d="M112 142 H144 M106 128 H150 M100 114 H156 M94 100 H162" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-opacity="0.9" />

  <!-- The Open Word / Scripture Foundation -->
  <path d="M68 176 C94 166 116 172 128 184 C140 172 162 166 188 176 L188 196 C162 186 140 192 128 204 C116 192 94 186 68 196 Z" 
        fill="url(#navyGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="4.5" 
        stroke-linejoin="round" />

  <!-- Center Spine of Open Book -->
  <line x1="128" y1="184" x2="128" y2="204" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
</svg>

    <path d="M112 142 H144 M106 128 H150 M100 114 H156 M94 100 H162" stroke="url(#lhGold)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M68 176 C94 166 116 172 128 184 C140 172 162 166 188 176 L188 196 C162 186 140 192 128 204 C116 192 94 186 68 196 Z" fill="url(#lhNavy)" stroke="url(#lhGold)" stroke-width="4.5" stroke-linejoin="round" />
